<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 132" role="img" aria-labelledby="title desc">
<title id="title">TalentLens</title>
<desc id="desc">TalentLens logo: a modern lens surrounding a letter T, paired with the TalentLens wordmark and the tagline See talent beyond the resume.</desc>
<defs>
  <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#123E2E"/>
    <stop offset="1" stop-color="#2F8F6B"/>
  </linearGradient>
  <linearGradient id="lens" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#BDE8C9"/>
    <stop offset="1" stop-color="#FFFFFF"/>
  </linearGradient>
  <linearGradient id="word" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#1F4D3A"/>
    <stop offset="1" stop-color="#2F8F6B"/>
  </linearGradient>
</defs>
<rect x="4" y="8" width="112" height="112" rx="30" fill="url(#tile)"/>
<!-- T monogram -->
<path d="M31 39H89M60 39V91" fill="none" stroke="#FFFFFF" stroke-width="10" stroke-linecap="round"/>
<!-- Lens ring and sweep -->
<path d="M24 79C31 51 54 28 81 28C101 28 107 43 99 59C89 81 63 98 39 99C25 100 17 93 24 79Z"
      fill="none" stroke="url(#lens)" stroke-width="5.5" stroke-linecap="round"/>
<path d="M22 92C45 88 75 68 96 43" fill="none" stroke="#C9A227" stroke-width="4.5" stroke-linecap="round"/>
<path d="M91 20L95 10L99 20L109 24L99 28L95 38L91 28L81 24Z" fill="#C9A227"/>
<text x="142" y="76" font-family="Manrope, Arial, sans-serif" font-size="59" font-weight="800" letter-spacing="-2.8" fill="#1F4D3A">Talent<tspan fill="#2F8F6B">Lens</tspan></text>
<path d="M145 96H177" stroke="#C9A227" stroke-width="2.5" stroke-linecap="round"/>
<text x="188" y="102" font-family="DM Sans, Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="3.2" fill="#718078">SEE TALENT BEYOND THE RESUME</text>
</svg>